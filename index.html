<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#2a7bf2" />
    <meta name="application-name" content="VanLink" />
    <link rel="icon" href="https://res.cloudinary.com/dyfecybo0/image/upload/f_auto,q_auto,w_64,h_64,c_fill/v1782459767/WhatsApp_Image_2026-05-23_at_15.51.54_mzlajs.jpg" />
    <link rel="shortcut icon" href="https://res.cloudinary.com/dyfecybo0/image/upload/f_auto,q_auto,w_64,h_64,c_fill/v1782459767/WhatsApp_Image_2026-05-23_at_15.51.54_mzlajs.jpg" />
    <link rel="apple-touch-icon" sizes="180x180" href="https://res.cloudinary.com/dyfecybo0/image/upload/f_auto,q_auto,w_180,h_180,c_fill/v1782459767/WhatsApp_Image_2026-05-23_at_15.51.54_mzlajs.jpg" />
    <title>VanLink Botswana</title>
  </head>
  <body>
    <div id="root"></div>
    <div
      id="legacy-browser"
      style="
        display: none;
        min-height: 100vh;
        padding: 24px;
        font-family: Arial, sans-serif;
        background: #071426;
        color: #ffffff;
      "
    >
      <div
        style="
          max-width: 520px;
          margin: 40px auto;
          padding: 20px;
          border-radius: 16px;
          background: #ffffff;
          color: #111827;
        "
      >
        <p
          style="
            margin: 0 0 8px;
            font-size: 12px;
            font-weight: 800;
            color: #0b73d9;
            letter-spacing: 0.08em;
            text-transform: uppercase;
          "
        >
          VanLink
        </p>
        <h1 style="margin: 0 0 10px; font-size: 24px; line-height: 1.1">
          Please update your browser
        </h1>
        <p style="margin: 0; color: #64748b; font-size: 14px; line-height: 1.5">
          This phone browser is too old to run the VanLink app. Please update Chrome, Safari, or
          Android System WebView, then open vanlink.co.bw again.
        </p>
      </div>
    </div>
    <script type="module" src="/src/main.jsx"></script>
    <script nomodule>
      document.getElementById("legacy-browser").style.display = "block";
    </script>
  </body>
</html>
